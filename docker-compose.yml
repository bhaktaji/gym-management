services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gymkhata-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=demo
      - MONGODB_URI=mongodb://mongo:27017/gymkhata_demo
      - JWT_SECRET=ProductionSecureRandomJwtSecretWithAtLeast32BytesLengthKey!2026
      - SUPER_ADMIN_PASSWORD=DemoSuperAdminPassword!2026
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
      - PORT=8080
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gymkhata-frontend
    ports:
      - "5173:8080"
    depends_on:
      - backend
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    container_name: gymkhata-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  mongo-data:
