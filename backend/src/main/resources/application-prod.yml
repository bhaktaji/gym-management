# Production profile.
#
# Activate with:  java -jar gymkhata-backend.jar --spring.profiles.active=prod
#
# Every secret and origin below has NO default on purpose: ProdConfigValidator
# refuses to start if they are missing, weak, or left at development defaults.
app:
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  jwt:
    secret: ${JWT_SECRET:}
  super-admin:
    phone: ${SUPER_ADMIN_PHONE:}
    password: ${SUPER_ADMIN_PASSWORD:}
    name: ${SUPER_ADMIN_NAME:Platform Admin}
  security:
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      requests-per-minute: ${RATE_LIMIT_RPM:30}

spring:
  data:
    mongodb:
      uri: ${MONGODB_URI}

server:
  port: ${SERVER_PORT:${PORT:8080}}
  forward-headers-strategy: framework
  tomcat:
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto
      internal-proxies: "127\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|0:0:0:0:0:0:0:1|::1|10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|192\\.168\\.\\d{1,3}\\.\\d{1,3}|169\\.254\\.\\d{1,3}\\.\\d{1,3}|172\\.(1[6-9]|2\\d|3[0-1])\\.\\d{1,3}\\.\\d{1,3}"
  error:
    include-stacktrace: never
    include-message: never

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

# Structured JSON logs to stdout (Cloud Run / container log collector compatible; no local log files or PII)
logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
    com.gymkhata: INFO

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
