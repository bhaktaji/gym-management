spring:
  application:
    name: gymkhata-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/gymkhata_dev}
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

server:
  port: ${SERVER_PORT:${PORT:8080}}
  forward-headers-strategy: framework
  max-http-request-header-size: 16KB
  tomcat:
    max-http-form-post-size: 2MB
    max-swallow-size: 2MB
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto
      internal-proxies: "127\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|0:0:0:0:0:0:0:1|::1|10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|192\\.168\\.\\d{1,3}\\.\\d{1,3}|169\\.254\\.\\d{1,3}\\.\\d{1,3}|172\\.(1[6-9]|2\\d|3[0-1])\\.\\d{1,3}\\.\\d{1,3}"

app:
  name: GymKhata
  timezone: Asia/Kolkata
  # Origins that may call the API (browser front-ends). Comma separated.
  cors-allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080,http://127.0.0.1:8080}"
  super-admin:
    phone: ${SUPER_ADMIN_PHONE:+919915110640}
    password: ${SUPER_ADMIN_PASSWORD:12345678*&^%$#@!}
    name: ${SUPER_ADMIN_NAME:Platform Super Admin}
  jwt:
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 30
    issuer: gymkhata
    # override with a long random value in production (app.jwt.secret)
    secret: "${JWT_SECRET:gymkhata-dev-secret-change-me-0123456789abcdef0123456789abcdef}"
  signup:
    auto-activate: ${SIGNUP_AUTO_ACTIVATE:false}
  pricing:
    monthly-price-paise: 99900
    currency: INR
    included: "Unlimited members, Memberships billing & GST invoices, UPI payments with QR, Check-ins, WhatsApp reminders, Leads reports & CSV import"
    not-charged: "No per-member fees, No per-message fees"
  upi:
    vpa-regex: "^[a-zA-Z0-9.\\-_]{2,}@[a-zA-Z]{2,}$"
  security:
    password-reset-ttl-minutes: 30
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      requests-per-minute: ${RATE_LIMIT_RPM:60}
  messaging:
    provider: ${MESSAGING_PROVIDER:clicktochat}
    whatsapp-cloud:
      enabled: ${WHATSAPP_CLOUD_ENABLED:false}
      token: ${WHATSAPP_CLOUD_TOKEN:}
      phone-number-id: ${WHATSAPP_CLOUD_PHONE_NUMBER_ID:}
      template-renewal-en: ${WHATSAPP_CLOUD_TEMPLATE_RENEWAL_EN:gymkhata_renewal_en}
      template-renewal-hi: ${WHATSAPP_CLOUD_TEMPLATE_RENEWAL_HI:gymkhata_renewal_hi}
  payments:
    provider: ${PAYMENT_PROVIDER:directupi}
    razorpay:
      enabled: ${RAZORPAY_ENABLED:false}
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
  quiet-hours:
    enabled: true
    start: "21:00"
    end: "08:00"
  # Default GST rules for physical fitness services (SAC 999723).
  # IMPORTANT: Confirm applicable GST rate, SAC code, and ITC eligibility with your Chartered Accountant (CA).
  gst:
    sac: "999723"
    rates:
      - rate: 18
        effective-from: "2000-01-01"
        itc-status: "With ITC"
      - rate: 5
        effective-from: "2025-09-22"
        itc-status: "No ITC"
    items:
      MEMBERSHIP:
        sac: "${GST_MEMBERSHIP_SAC:999723}"
        rates:
          - rate: 18
            effective-from: "2000-01-01"
            itc-status: "With ITC"
          - rate: 5
            effective-from: "2025-09-22"
            itc-status: "No ITC"
      PT:
        sac: "${GST_PT_SAC:999723}"
        rates:
          - rate: 18
            effective-from: "2000-01-01"
            itc-status: "With ITC"
          - rate: 5
            effective-from: "2025-09-22"
            itc-status: "No ITC"
      ADMISSION_FEE:
        sac: "${GST_ADMISSION_FEE_SAC:999723}"
        rates:
          - rate: 18
            effective-from: "2000-01-01"
            itc-status: "With ITC"
          - rate: 5
            effective-from: "2025-09-22"
            itc-status: "No ITC"

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.gymkhata: INFO
