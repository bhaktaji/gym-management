name: CI / CD Pipeline

on:
  push:
    branches: [ main, release/prod-ready ]
  pull_request:
    branches: [ main, release/prod-ready ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    name: Backend Tests (Spring Boot + Mongo)
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Backend Unit & Integration Tests
        run: mvn -f backend/pom.xml clean test -B
        env:
          SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/gymkhata_test

  test-frontend:
    name: Frontend Tests & Bundle Budget (Vite + React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm --prefix frontend ci

      - name: Run Frontend Component Tests
        run: npm --prefix frontend test

      - name: Run Production Bundle Build
        run: npm --prefix frontend run build

  test-e2e:
    name: Playwright E2E Suite (Real Backend + MongoDB, Desktop & Mobile 390px)
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies & Chromium
        run: |
          npm --prefix frontend ci
          npx --prefix frontend playwright install --with-deps chromium

      - name: Package Backend & Run Real-Stack Playwright E2E
        run: |
          mvn -f backend/pom.xml package -DskipTests -B
          java -jar backend/target/gymkhata-backend-0.1.0.jar --spring.profiles.active=demo --server.port=8080 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/actuator/health && break || sleep 1; done
          BACKEND_PORT=8080 npm --prefix frontend run dev -- --port 5173 --host 127.0.0.1 &
          for i in $(seq 1 15); do curl -sf http://127.0.0.1:5173 && break || sleep 1; done
          ./frontend/node_modules/.bin/playwright test -c frontend/playwright.config.ts

      - name: Upload Playwright Traces & Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-artifacts
          path: |
            screenshots/
            frontend/screenshots/
            test-results/
            frontend/test-results/

  deploy-staging:
    name: Deploy Single-Container App to Cloud Run Staging (asia-south1)
    needs: [test-backend, test-frontend, test-e2e]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/release/prod-ready' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity)
        if: env.GCP_PROJECT_ID != ''
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Deploy Unified Container (Spring Boot + PWA) to Cloud Run Staging
        if: env.GCP_PROJECT_ID != ''
        run: |
          gcloud run deploy gymkhata-staging \
            --source=. \
            --region=asia-south1 \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=3 \
            --set-env-vars="SPRING_PROFILES_ACTIVE=prod" \
            --set-secrets="JWT_SECRET=JWT_SECRET:latest,SUPER_ADMIN_PASSWORD=SUPER_ADMIN_PASSWORD:latest,MONGODB_URI=MONGODB_URI:latest,CORS_ALLOWED_ORIGINS=CORS_ALLOWED_ORIGINS:latest"
